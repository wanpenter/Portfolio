<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG source — do not link publicly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Source for assets/og-image.png — regenerate by rendering this at 1200x630
     and cropping the #card element exactly. Not part of the live site. */
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:#444; }
  #card{
    position:absolute; top:0; left:0;
    width:1200px; height:630px;
    background:#0B0B10;
    overflow:hidden;
    font-family:'IBM Plex Mono', ui-monospace, monospace;
  }
  .ghost{
    position:absolute; top:-40px; left:-30px;
    font-family:'Archivo', system-ui, sans-serif; font-weight:900;
    font-size:340px; line-height:1; letter-spacing:-.04em;
    color:#FF3355; opacity:.16;
    white-space:nowrap;
  }
  .content{
    position:relative; z-index:1;
    height:100%;
    display:flex; flex-direction:column; justify-content:center;
    padding:0 90px;
  }
  .role{
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-size:20px; letter-spacing:.16em; text-transform:uppercase;
    color:#FF3355; margin-bottom:22px;
  }
  h1{
    font-family:'Archivo', system-ui, sans-serif; font-weight:800;
    font-size:112px; letter-spacing:-.03em; line-height:1;
    color:#F4F4F6; margin-bottom:26px;
  }
  .tagline{
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-size:26px; color:#8C8D97; max-width:820px;
  }
  .url{
    position:absolute; bottom:44px; left:90px; z-index:1;
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-size:20px; letter-spacing:.08em; color:#8C8D97;
    display:flex; align-items:center; gap:10px;
  }
  .url .dot{ width:9px; height:9px; border-radius:50%; background:#FF3355; }
</style>
</head>
<body>
  <div id="card">
    <span class="ghost">PORTFOLIO</span>
    <div class="content">
      <div class="role">Game &amp; XR Developer · Web Developer</div>
      <h1>Ikhwanuddin</h1>
      <div class="tagline">Building systems that connect games, Mixed Reality/VR, and full-stack web apps.</div>
    </div>
    <div class="url"><span class="dot"></span>ikhwanuddin.online</div>
  </div>
</body>
</html>
